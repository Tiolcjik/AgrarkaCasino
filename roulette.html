<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Срулетка — Аграрка Элит Казино</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar topbar-pro">
  <a href="index.html" class="logo"><span class="crown">🌾</span> Аграрка Элит Казино</a>
  <div class="topbar-right">
    <button id="sound-toggle" class="icon-tool-btn" title="Звук">🔊</button>
    <div class="balance-pill balance-pill-pro">
      <div class="balance-ring"></div>
      <span class="chip-icon">💎</span>
      <div class="balance-info">
        <span class="balance-label">Твой баланс</span>
        <span id="balance-amount">$1,000.00</span>
      </div>
    </div>
  </div>
</header>

<div class="game-shell">
  <a href="index.html" class="back-link">← Все игры</a>

  <div class="game-panel" style="margin-top:16px;position:relative;">
<div class="game-header-row">
      <h2 class="game-title">🎡 Срулетка</h2>
    </div>

    <div class="wheel-wrap">
      <div class="wheel-pointer">▼</div>
      <div class="wheel-outer">
        <svg id="roulette-wheel" width="264" height="264" viewBox="0 0 264 264"></svg>
      </div>
      <div class="roulette-result-badge" id="roulette-result-badge">—</div>
    </div>

    <div class="bet-display" style="margin-top:24px;">Размер фишки: <b id="current-bet">$50</b></div>
    <div class="chip-row" id="chip-row">
      <div class="chip active" data-bet="25">25</div>
      <div class="chip" data-bet="50">50</div>
      <div class="chip" data-bet="100">100</div>
      <div class="chip" data-bet="250">250</div>
      <div class="chip" data-bet="500">500</div>
      <div class="chip chip-hi" data-bet="1000">1K</div>
      <div class="chip chip-hi" data-bet="5000">5K</div>
      <div class="chip chip-hi" data-bet="10000">10K</div>
      <div class="chip chip-max" data-bet="max">MAX</div>

    </div>
    <div class="custom-bet-row">
      <label>Своя ставка $</label>
      <input type="number" id="custom-bet-input" min="1" step="1" placeholder="100">
      <button type="button" id="custom-bet-apply">OK</button>
    </div>

      <div class="chip" data-bet="50">50</div>
      <div class="chip" data-bet="100">100</div>
      <div class="chip" data-bet="250">250</div>
      <div class="chip" data-bet="500">500</div>
    </div>

    <div class="bet-board">
      <p class="bet-board-label">Ставка на число (×35)</p>
      <div class="roulette-table">
        <div class="numbers-grid" id="numbers-grid"></div>
        <div class="dozens-row" id="dozens-row"></div>
        <div class="columns-row" id="columns-row"></div>
      </div>

      <p class="bet-board-label">Ставка на сектор (×2)</p>
      <div class="outside-bets">
        <button class="bet-btn c-red" data-outside="red">🔴 Красное</button>
        <button class="bet-btn c-black" data-outside="black">⚫ Чёрное</button>
        <button class="bet-btn c-neutral" data-outside="even">Чётное</button>
        <button class="bet-btn c-neutral" data-outside="odd">Нечётное</button>
        <button class="bet-btn c-neutral" data-outside="low">1–18</button>
        <button class="bet-btn c-neutral" data-outside="high">19–36</button>
      </div>

      <div class="active-bets-box">
        <p class="active-bets-title">Активные ставки (клик добавляет, ✕ убирает)</p>
        <div class="active-bets-list" id="active-bets-list">
          <span class="active-bets-empty">Пока нет ставок</span>
        </div>
        <div class="total-staked-row">Всего на столе: <b id="total-staked">$0</b></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="primary-btn" id="spin-btn">Крутить рулетку</button>
      <button class="secondary-btn" id="clear-bets-btn">Очистить ставки</button>
    </div>

    <p class="game-message" id="roulette-message"></p>
  </div>
</div>

<div class="win-overlay" id="win-overlay">
  <div class="win-card">
    <span class="win-title">Выигрыш!</span>
    <span class="sub"></span>
  </div>
</div>

<div id="toast-stack"></div>
<div id="meme-popup" class="meme-popup" hidden>
  <div class="meme-popup-card">
    <button class="meme-popup-close" id="meme-popup-close">✕</button>
    <div class="meme-popup-emoji" id="meme-popup-emoji">🐸</div>
    <p id="meme-popup-text"></p>
  </div>
</div>

<script src="common.js"></script>
<script src="roulette.js"></script>
</body>
</html>
