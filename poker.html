<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видеопокер — Аграрка Элит</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar topbar-pro">
  <a href="index.html" class="logo"><span class="crown">🌾</span> Аграрка Элит</a>
  <div class="topbar-right">
    <button id="sound-toggle" class="icon-tool-btn" title="Звук">🔊</button>
    <div class="balance-pill balance-pill-pro">
      <div class="balance-ring"></div>
      <span class="chip-icon">💎</span>
      <div class="balance-info"><span class="balance-label">Твой баланс</span><span id="balance-amount">$1,000.00</span></div>
    </div>
  </div>
</header>
<div class="game-shell">
  <a href="index.html" class="back-link">← Все игры</a>
  <div class="game-panel" style="margin-top:16px;">
<div class="game-header-row"><h2 class="game-title">♠️ Видеопокер</h2></div>
    <p style="text-align:center;color:var(--text-dim);font-size:13px;">Jacks or Better · клик по карте = HOLD</p>
    <div class="poker-hand" id="poker-hand"></div>
    <p style="text-align:center;color:var(--gold-bright);font-weight:700;min-height:24px;" id="poker-rank"></p>
    <div class="bet-display">Ставка: <b id="current-bet">$100</b></div>
    <div class="chip-row" id="chip-row">
      <div class="chip" data-bet="50">50</div>
      <div class="chip active" data-bet="100">100</div>
      <div class="chip" data-bet="250">250</div>
      <div class="chip" data-bet="500">500</div>
      <div class="chip chip-hi" data-bet="1000">1K</div>
      <div class="chip chip-hi" data-bet="5000">5K</div>
      <div class="chip chip-hi" data-bet="10000">10K</div>
      <div class="chip chip-max" data-bet="max">MAX</div>

    </div>
    <div class="custom-bet-row">
      <label>Своя ставка $</label>
      <input type="number" id="custom-bet-input" min="1" placeholder="100">
      <button type="button" id="custom-bet-apply">OK</button>
    </div>
    <div class="btn-row">
      <button class="primary-btn" id="poker-deal">Раздача</button>
      <button class="primary-btn hidden" id="poker-draw">Замена</button>
    </div>
    <p class="game-message" id="poker-msg"></p>
  </div>
</div>
<div class="win-overlay" id="win-overlay"><div class="win-card"><span class="win-title">Покер!</span><span class="sub"></span></div></div>
<div id="toast-stack"></div>
<div id="meme-popup" class="meme-popup" hidden><div class="meme-popup-card"><button class="meme-popup-close" id="meme-popup-close">✕</button><div class="meme-popup-emoji" id="meme-popup-emoji">🐸</div><p id="meme-popup-text"></p></div></div>
<script src="common.js"></script>
<script src="poker.js"></script>
</body>
</html>
