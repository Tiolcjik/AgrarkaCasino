<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слотики — Аграрка Элит Казино</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar topbar-pro">
  <a href="index.html" class="logo"><span class="crown">🌾</span> Аграрка Элит Казино</a>
  <div class="topbar-right">
    <button id="sound-toggle" class="icon-tool-btn" title="Звук">🔊</button>
    <div class="balance-pill balance-pill-pro">
      <div class="balance-ring"></div>
      <span class="chip-icon">💎</span>
      <div class="balance-info">
        <span class="balance-label">Твой баланс</span>
        <span id="balance-amount">$1,000.00</span>
      </div>
    </div>
  </div>
</header>

<div class="game-shell">
  <a href="index.html" class="back-link">← Все игры</a>

  <div class="game-panel" style="margin-top:16px;">
    <div class="game-header-row">
      <h2 class="game-title">🎰 Слотики</h2>
      <button class="icon-btn" id="open-paytable" title="Таблица выплат">📖</button>
    </div>

    <div class="jackpot-meter">
      <span class="jp-label">💎 Прогрессивный джекпот</span>
      <div class="jp-amount" id="jackpot-amount">$18,420</div>
    </div>

    <div class="theme-tabs" id="theme-tabs">
      <button class="theme-tab active" data-theme="classic">🔥 Потужный</button>
      <button class="theme-tab" data-theme="egypt">🏺 Египет</button>
      <button class="theme-tab" data-theme="space">🚀 Космос</button>
    </div>

    <div class="slot-cabinet">
      <div class="reels-frame">
        <div class="reel-window"><div class="reel-strip" id="strip1"></div></div>
        <div class="reel-window"><div class="reel-strip" id="strip2"></div></div>
        <div class="reel-window"><div class="reel-strip" id="strip3"></div></div>
      </div>
      <button class="paytable-btn" id="open-paytable-2">Таблица выплат</button>
    </div>

    <div class="bet-display">Ставка: <b id="current-bet">$50</b></div>

    <div class="chip-row" id="chip-row">
      <div class="chip active" data-bet="25">25</div>
      <div class="chip" data-bet="50">50</div>
      <div class="chip" data-bet="100">100</div>
      <div class="chip" data-bet="250">250</div>
      <div class="chip" data-bet="500">500</div>
      <div class="chip chip-hi" data-bet="1000">1K</div>
      <div class="chip chip-hi" data-bet="5000">5K</div>
      <div class="chip chip-hi" data-bet="10000">10K</div>
      <div class="chip chip-max" data-bet="max">MAX</div>

    </div>

    <div class="custom-bet-row">
      <label>Своя ставка $</label>
      <input type="number" id="custom-bet-input" min="1" step="1" placeholder="100">
      <button type="button" id="custom-bet-apply">OK</button>
    </div>

    <button class="primary-btn" id="spin-btn">Крутить</button>

    <div class="slot-toggles">
      <button class="toggle-btn" id="turbo-btn">⚡ Турбо</button>
      <button class="toggle-btn" id="autoplay-btn">🔁 Автоигра ×10</button>
    </div>

    <p class="game-message" id="slot-message"></p>
  </div>
</div>

<div class="modal-overlay" id="paytable-modal">
  <div class="modal-box">
    <h3>Таблица выплат — <span id="paytable-theme-name">Потужный</span></h3>
    <div id="paytable-rows"></div>
    <button class="modal-close" id="close-paytable">Понятно</button>
  </div>
</div>

<div class="win-overlay" id="win-overlay">
  <div class="win-card">
    <span class="win-title">Джекпот!</span>
    <span class="sub"></span>
  </div>
</div>

<div id="toast-stack"></div>
<div id="meme-popup" class="meme-popup" hidden>
  <div class="meme-popup-card">
    <button class="meme-popup-close" id="meme-popup-close">✕</button>
    <div class="meme-popup-emoji" id="meme-popup-emoji">😂</div>
    <div class="meme-popup-text" id="meme-popup-text"></div>
  </div>
</div>

<script src="common.js"></script>
<script src="slots.js"></script>
</body>
</html>
